<script>
const {useState,useEffect,useRef}=React;const html=htm.bind(React.createElement);const HAS=!!window.claude;
const pad=n=>String(n).padStart(2,'0'),iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()),TODAY=iso(new Date());
const P=s=>{const a=s.split('-').map(Number);return new Date(a[0],a[1]-1,a[2])};
const addM=(s,n)=>{const d=P(s),t=new Date(d.getFullYear(),d.getMonth()+n,1),l=new Date(t.getFullYear(),t.getMonth()+1,0).getDate();return iso(new Date(t.getFullYear(),t.getMonth(),Math.min(d.getDate(),l)))};

const CATS=['Elektra','Vanduo','Dujos','Šildymas','Internetas','Telefonas','Nuoma','Paskola','Draudimas','Automobilis','Atliekos','Kita'];
const EM={Elektra:'⚡',Vanduo:'💧',Dujos:'🔥',Šildymas:'♨️',Internetas:'🌐',Telefonas:'📱',Nuoma:'🏠',Paskola:'🏦',Draudimas:'🛡️',Automobilis:'🚗',Atliekos:'♻️',Kita:'🧾'};

const TPL=[['Nekilnojamojo turto mokestis','Kita','yearly'],['Žemės mokestis','Kita','yearly'],['Namo bendrijos / administravimo įmoka','Nuoma','monthly'],['Kaupiamosios lėšos','Kita','monthly'],['Namų draudimas','Draudimas','yearly'],['Dūmtraukių patikra','Kita','yearly'],['Vaikų darželis / būreliai','Kita','monthly'],['Sporto klubas','Kita','monthly'],['Prenumerata (Netflix, Spotify…)','Kita','monthly'],['Signalizacija / apsauga','Kita','monthly'],['Domofonas / liftas','Kita','monthly'],['GPM deklaravimas','Kita','yearly'],['Sveikatos draudimo įmokos','Kita','monthly']];
const ics=S=>{const E=[...S.payments.filter(p=>!p.paid).map(p=>[p.id,p.due,'💳 '+p.name+' '+eur(p.amount)]),...alld(S).map(d=>[d.car.plate+d.k+d.date,d.date,'📄 '+d.car.make+' '+d.k]),...S.cars.filter(c=>c.tireDate).map(c=>[c.id+'t',c.tireDate,'🛞 Keisti padangas '+c.plate])],z=t=>t.replace(/\n/g,' ').replace(/([,;])/g,'\\$1');return ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Mokesciu asistentas//LT',...E.flatMap(([id,dt,t])=>['BEGIN:VEVENT','UID:'+id+'@mokesciai','DTSTAMP:'+TODAY.replace(/-/g,'')+'T000000Z','DTSTART;VALUE=DATE:'+dt.replace(/-/g,''),'SUMMARY:'+z(t),...S.rem.flatMap(r=>['BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+z(t),'TRIGGER:-P'+r+'D','END:VALARM']),'END:VEVENT']),'END:VCALENDAR'].join('\r\n')};
const KEY='mokesciu-asistentas-v1';
const SBU='https://vhkloqcrgqhufhcsnvfh.supabase.co',SBK='sb_publishable_diTAHrBST2LOdTZ4BjNGkg_RH3g16Gj';
let sb=null;try{sb=window.supabase?window.supabase.createClient(SBU,SBK):null}catch(e){}
const norm=o=>({...o,payments:o.payments||[],cars:(o.cars||[]).map(c=>({service:[],...c})),docs:o.docs||[],rem:o.rem||[30,7,1]});
const bkOld=()=>{try{return Date.now()-(+localStorage.getItem('ma-bk')||0)>30*864e5}catch(e){return false}};
const stor=(()=>{try{localStorage.setItem('_t','1');localStorage.removeItem('_t');return true}catch(e){return false}})();
function seed(){const payments=[];
 [['Elektra',65,'Elektra',10],['Internetas',25,'Internetas',20],['Telefonas',20,'Telefonas',1],['Šildymas',48,'Šildymas',15]].forEach(([name,amt,cat,day])=>{const sid=uid();
  for(let i=-11;i<=0;i++){const due=addM(TODAY.slice(0,8)+pad(day),i);payments.push({id:uid(),sid,name,amount:amt+(i?((i*7)%5+5)%5:0),due,cat,rec:'monthly',note:'',paid:i<0,paidAt:i<0?due:null,demo:1})}});
 [['Automobilio draudimas',180,'Draudimas',addD(TODAY,25)],['Techninė apžiūra',35,'Automobilis',addD(TODAY,-12)]].forEach(([name,amount,cat,due])=>payments.push({id:uid(),sid:uid(),name,amount,due,cat,rec:'yearly',note:'',paid:false,paidAt:null,demo:1}));
 return {payments,cars:[{id:uid(),make:'Volkswagen',model:'Passat',plate:'ABC123',insEnd:addD(TODAY,25),techEnd:addD(TODAY,-12),tireType:'Vasarinės',tireDate:(+TODAY.slice(0,4)+1)+'-04-15',service:[{id:uid(),date:addD(TODAY,-120),desc:'Tepalų keitimas',cost:95}],demo:1}],rem:[30,7,1]}}
const roll=ps=>{const L={};ps.forEach(p=>{if(!L[p.sid]||p.due>L[p.sid].due)L[p.sid]=p});const add=[];Object.values(L).forEach(p=>{if(p.rec==='none'||p.sid.startsWith('g-'))return;let d=p,n=0;for(let i=0;i<24;i++){const nd=addM(d.due,STEP[p.rec]);if(ymk(nd)>ymk(TODAY))break;d={...p,id:uid(),paid:false,paidAt:null,due:nd};n++}if(n)add.push(d)});return add.length?[...ps,...add]:ps};
const tidy=ps=>ps.filter(p=>p.paid||ymk(p.due)<=ymk(TODAY)||p.rec==='none'||p.sid.startsWith('g-')||!ps.some(x=>x.sid===p.sid&&x.paid&&x.due<p.due));
const load=()=>{try{const o=JSON.parse(localStorage.getItem(KEY));if(o&&o.payments)return {...o,cars:(o.cars||[]).map(c=>({service:[],...c})),docs:o.docs||[],rem:o.rem||[30,7,1],payments:roll(tidy(o.payments))}}catch(e){}return seed()};
function projectMonth(pays,key){const L={};pays.forEach(p=>{if(!L[p.sid]||p.due>L[p.sid].due)L[p.sid]=p});let t=0;
 Object.values(L).forEach(p=>{if(!p.paid&&ymk(p.due)===key)t+=p.amount;if(p.rec!=='none'){let d=p.due;for(let i=0;i<30;i++){d=addM(d,STEP[p.rec]);if(ymk(d)===key)t+=p.amount;if(ymk(d)>key)break}}});return t}
const csv=items=>'\ufeff'+['Pavadinimas;Kategorija;Terminas;Suma (€);Būsena;Sumokėta;Pastabos'].concat(items.map(p=>[p.name,p.cat,p.due,String(p.amount).replace('.',','),pst(p)[0],p.paidAt||'',(p.note||'').replace(/;/g,',')].join(';'))).join('\n');
const dl=(name,text,mime)=>{try{const u=URL.createObjectURL(new Blob([text],{type:mime}));const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1500)}catch(e){}};

const Modal=({title,onClose,children})=>html`<div className="ov" onClick=${onClose}><div className="md" onClick=${e=>e.stopPropagation()}><h3>${title}</h3>${children}</div></div>`;
const Bars=({data})=>{const mx=Math.max(1,...data.map(d=>d.v));return html`<svg viewBox="0 0 600 190" style=${{width:'100%',height:'auto'}} role="img" aria-label="Išlaidų grafikas">${data.map((d,i)=>{const h=d.v/mx*125,x=i*50+8;return html`<g key=${d.k}><title>${lbl(d.k)}: ${eur(d.v)}</title><rect x=${x} y=${150-h} width="34" height=${h} rx="5" style=${{fill:'var(--ac)',opacity:i===data.length-1?1:.55}}/><text x=${x+17} y="172" textAnchor="middle" fontSize="11" style=${{fill:'var(--mu)'}}>${MN[+d.k.slice(5)-1].slice(0,3)}</text><text x=${x+17} y=${144-h} textAnchor="middle" fontSize="10" style=${{fill:'var(--tx)'}}>${d.v?Math.round(d.v):''}</text></g>`})}</svg>`};

function Home({S,pay,add,gm,exp}){
 const cur=ymk(TODAY),items=S.payments.filter(p=>ymk(p.due)===cur),tot=sum(items),paid=sum(items.filter(p=>p.paid)),open=S.payments.filter(p=>!p.paid);
 const late=open.filter(p=>p.due<TODAY).sort(byDue),soon=open.filter(p=>p.due>=TODAY).sort(byDue).slice(0,5),dl=alld(S).filter(d=>d.days<=60).sort((a,b)=>a.days-b.days);
 const data=last12(cur).map(k=>({k,v:sum(S.payments.filter(p=>ymk(p.due)===k))}));
 return html`<div><${Head} t=${'Apžvalga · '+lbl(cur)}>${(HAS||GCID)&&html`<button className="btn" onClick=${gm}>✉️ Importuoti iš Gmail</button>`}<button className="btn" onClick=${()=>exp({title:'Priminimai kalendoriui (.ics)',text:ics(S),file:'mokesciu-priminimai.ics',mime:'text/calendar'})}>📲 Priminimai telefone</button><button className="btn pri" onClick=${add}>+ Pridėti mokėjimą</button><//>

 <div className="g2"><div className="card"><h2>⚠️ Vėluojantys mokėjimai</h2>${late.length?late.map(p=>html`<${PRow} key=${p.id} p=${p} pay=${pay}/>`):html`<p className="note">Vėluojančių mokėjimų nėra.</p>`}</div>
 <div className="card"><h2>📌 Artimiausi mokėjimai</h2>${soon.length?soon.map(p=>html`<${PRow} key=${p.id} p=${p} pay=${pay}/>`):html`<p className="note">Artimų mokėjimų nėra.</p>`}</div></div>

function PayForm({init,onSave,onClose}){
 const [f,setF]=useState({name:'',due:TODAY,cat:'Kita',rec:'none',note:'',...init,amount:init&&init.amount!=null?String(init.amount):''}),[er,setEr]=useState('');
 const set=k=>e=>setF({...f,[k]:e.target.value});
